<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Store...</title>
    <script type="text/javascript">
        window.onload = function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // 1. 안드로이드 기기 (구글 플레이스토어 전체 주소 입력)
            if (/android/i.test(userAgent)) {
                var packageId = "com.bilguuneesoft.polygondefense";
    
    // 크롬 및 최신 안드로이드 브라우저에서 플레이스토어 앱을 다이렉트로 여는 딥링크
    window.location.href = "intent://details?id=" + packageId + "#Intent;scheme=market;package=com.android.vending;end";
            } 
            // 2. iOS 기기 (아이폰/아이패드 애플 앱스토어 전체 주소 입력)
            else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = "https://apps.apple.com/us/app/polygon-defense/id6781591712";
            } 
            // 3. PC 브라우저 등으로 접속했을 때 보낼 기본 주소 (홈페이지 등)
            else {
                window.location.href = "https://truthful-spectacles-323.notion.site/Polygon-Defense-383ebae08c7d805a9343e9c88e8562cb"; 
            }
        }
    </script>
</head>
<body>
    <p style="text-align:center; margin-top:50px; font-family:sans-serif; color:#ffffff; background-color:#000000;">
        Redirecting to the app store...
    </p>
</body>
</html>
